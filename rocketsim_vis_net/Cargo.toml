[package]
name = "rocketsim_vis_net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Detached-viewer network interface for RocketSim (frames, inputs, launcher)"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
egui = "0.31"
glam.workspace = true
postcard = { version = "1", features = ["alloc"] }
rocketsim = { path = "../rocketsim", version = "0.2.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
toml = "0.8"

[lints.clippy]
all = "warn"

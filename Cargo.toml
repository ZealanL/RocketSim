[workspace]
package.version = "0.2.0"
package.license-file = "LICENSE"
resolver = "3"
members = [
  "rocketsim",
  "rocketsim_derive",
  "rocketsim_test_utils",
  "rocketsim_vis",
]

[profile.dev]
opt-level = 1

[profile.release]
debug = true
lto = true
panic = "abort"

# TODO: Temporary
[profile.test]
opt-level = 0
debug = true

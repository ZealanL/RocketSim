name: Release

on:
  push:
    tags: ["v0.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/ci/release.py check --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ""
            macos_deployment_target: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
            macos_deployment_target: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ""
            macos_deployment_target: "11.0"
          - os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""
            macos_deployment_target: "11.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev libxkbcommon-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dist-${{ matrix.target }}
      - name: Build the viewer binaries
        run: cargo build --locked --profile dist -p rocketsim_viewer --bins --target "${{ matrix.target }}"
      - name: Test and package the binaries
        run: python tools/ci/release.py package --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    name: Verify assets and create a draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: viewer-*
          merge-multiple: true
          path: dist
      - name: Verify every archive and checksum
        run: python tools/ci/release.py verify --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p target
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > target/release-is-draft.txt; then
            if ! grep -qx true target/release-is-draft.txt; then
              echo "Refusing to replace assets on a published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "RocketSim $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

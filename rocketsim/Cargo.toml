[package]
name = "rocketsim"
edition = "2024"
license-file.workspace = true
version.workspace = true

[dependencies]
ahash = "0.8.12"
arrayvec = "0.7.6"
byteorder = "1.5.0"
fastrand = "2.3.0"
log = "0.4.29"
env_logger = "0.11.8"
glam = { workspace = true }

[dev-dependencies]
rocketsim_rs = "0.36.0" # For comparing to original C++ RocketSim in tests
device_query = "4.0.1" # For the RocketSimVis example
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[features]
default = []

[lints.clippy]
all = "warn"
# nursery = "warn"
# pedantic = "warn"
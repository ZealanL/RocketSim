[package]
name = "rocketsim_viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "3D visualizer for RocketSim Rocket League simulation"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "rocketsim-viewer"

[[bin]]
name = "rocketsim-viewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_glow = "0.37"
gilrs = "0.11"
glam.workspace = true
glow = "0.17"
png = "0.18.0"
postcard = { version = "1", features = ["alloc"] }
rocketsim = { path = "../rocketsim", version = "0.3.0", features = ["serde"] }
rocketsim_vis = { path = "../rocketsim_vis", version = "0.3.0" }
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"

[lints.clippy]
all = "warn"

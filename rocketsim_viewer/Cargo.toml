[package]
name = "rocketsim_viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "3D visualizer for RocketSim Rocket League simulation"
readme = "README.md"
repository.workspace = true
license-file = "LICENSES.md"
keywords.workspace = true
categories.workspace = true
default-run = "rocketsim-viewer"
autobins = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "rocketsim-viewer"
path = "src/main.rs"

[[bin]]
name = "debug-render-bench"
path = "src/bin/debug_bench.rs"
required-features = ["debug-bench"]

[features]
debug-bench = []

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_glow = "0.37"
gilrs = "0.11"
glam.workspace = true
glow = "0.17"
png = "0.18.0"
postcard = { version = "1", features = ["alloc"] }
rocketsim = { path = "../rocketsim", version = "0.3.1", features = ["serde"] }
rocketsim_vis = { path = "../rocketsim_vis", version = "0.3.1" }
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"

[lints.clippy]
all = "warn"

[package]
name = "rocketsim_vis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Detached-viewer network interface for RocketSim (frames, transport, launcher)"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
glam.workspace = true
postcard = { version = "1", features = ["alloc"] }
rocketsim = { path = "../rocketsim", version = "0.3.1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"

[lints.clippy]
all = "warn"

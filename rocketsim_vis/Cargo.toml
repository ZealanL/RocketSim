[package]
name = "rocketsim_vis"
version.workspace = true
edition = "2024"
license-file.workspace = true

[dependencies]
ahash = "0.8.12"
glam = { version = "0.33.0", features = ["debug-glam-assert"] }
miniquad = "0.4.8"
png = "0.18.0"
rocketsim = { path = "../rocketsim" }

[dev-dependencies]
device_query = "4.0.1"
rocketsim_rs = "0.36.0"
rocketsim_test_utils = { path = "../rocketsim_test_utils" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[lints.clippy]
all = "warn"
